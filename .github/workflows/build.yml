name: Build ChessVision APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install unzip tool
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Extract project archive
      run: |
        mkdir -p extracted_project
        unzip ChessVision.zip -d extracted_project

    - name: Build APK with Gradle
      run: |
        cd extracted_project/ChessVision
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessVision-Debug
        path: extracted_project/ChessVision/app/build/outputs/apk/debug/*.apk
