name: Build ChessVision APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install unzip tool
      run: sudo apt-get install -y unzip

    - name: Extract project archive
      run: |
        mkdir -p extracted_project
        unzip ChessVision.zip -d extracted_project
        ls -R extracted_project

    - name: Build APK with Gradle
      run: |
        cd extracted_project
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW_PATH")
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessVision-Debug
        path: |
          extracted_project/**/build/outputs/apk/debug/*.apk
