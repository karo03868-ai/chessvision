
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessVision_orientation_fix.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ChessVision project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ChessVision_orientation_fix.zip ]; then
            echo 'ChessVision ZIP not found'
            exit 1
          fi

          mkdir -p source
          unzip -q ChessVision_orientation_fix.zip -d source

          if [ -f source/ChessVision/settings.gradle.kts ]; then
            echo 'PROJECT_DIR=source/ChessVision' >> "$GITHUB_ENV"
          elif [ -f source/settings.gradle.kts ]; then
            echo 'PROJECT_DIR=source' >> "$GITHUB_ENV"
          else
            echo 'Project files not found'
            exit 1
          fi

      - name: Download Stockfish
        run: bash "$PROJECT_DIR/scripts/fetch_stockfish.sh"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
