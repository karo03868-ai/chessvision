name: Build ChessVision APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p extracted_project
          unzip -o ChessVision.zip -d extracted_project

            - name: Build       - name: Build APK
        run: |
          cd extracted_project
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-Debug
          path: extracted_project/ChessVision/app/build/outputs/apk/debug/*.apk
