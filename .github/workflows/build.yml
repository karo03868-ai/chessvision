name: Build ChessVision APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install unzip tool
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Extract and show files
      run: |
        mkdir -p extracted_project
        unzip ChessVision.zip -d extracted_project
        echo "=== СМОТРИМ ЧТО ВНУТРИ ==="
        find extracted_project -maxdepth 3
concurrency: 
