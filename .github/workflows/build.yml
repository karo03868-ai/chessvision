name: Build ChessVision APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install unzip tool
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Extract project archive
      run: |
        mkdir -p extracted_project
        unzip ChessVision.zip -d extracted_project
        echo "=== CONTENTS ==="
        ls -la extracted_project

    - name: Build APK with Gradle
      run: |
        cd extracted_project
        # Безопасно ищем gradlew по всей структуре
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, searching for build.gradle..."
          BUILD_GRADLE=$(find . -name "build.gradle" -print -quit)
          if [ -n "$BUILD_GRADLE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            echo "Found build.gradle in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle assembleDebug
          else
            echo "Error: Gradle files not found in archive!"
            exit 1
          fi
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChessVision-Debug
        path: extracted_project/**/app/build/outputs/apk/debug/*.apk
