name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare
        run: |
          if [ -f ChessVision.zip ]; then
            unzip -q ChessVision.zip
            echo "DIR=ChessVision" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi
      - name: Fetch Stockfish
        run: bash $DIR/scripts/fetch_stockfish.sh
      - name: Build
        run: cd $DIR && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk 
